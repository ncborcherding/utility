    "CD4 Naive": "T_naive"
    "CD4 TCM": "T_cm"
    "CD4 TEM": "T_em"
    "CD4 CTL": "CD8_CTL"  # These are cytotoxic CD4s
    "CD4 Proliferating": "T_proliferating"
    "CD8 Naive": "CD8_naive"
    "CD8 TCM": "CD8_Tcm"
    "CD8 TEM": "CD8_Tem"
    "CD8 Proliferating": "T_proliferating"
    "Treg": "Treg"
    "MAIT": "MAIT"
    "gdT": "gdT"
    "dnT": "dnT"
    "NK": "NK"
    "NK_CD56bright": "NK_CD56bright"
    "NK Proliferating": "T_proliferating"
    
  Monaco.labels:
    "Naive CD4 T cells": "T_naive"
    "Central memory CD4 T cells": "T_cm"
    "Effector memory CD4 T cells": "T_em"
    "Terminal effector CD4 T cells": "CD8_Temra"  # Temra-like
    "Naive CD8 T cells": "CD8_naive"
    "Central memory CD8 T cells": "CD8_Tcm"
    "Effector memory CD8 T cells": "CD8_Tem"
    "Terminal effector CD8 T cells": "CD8_Temra"
    "T regulatory cells": "Treg"
    "Th1 cells": "Th1"
    "Th2 cells": "Th2"
    "Th17 cells": "Th17"
    "Th1/Th17 cells": "Th17"  # Th1/17 hybrid
    "Follicular helper T cells": "Tfh"
    "MAIT cells": "MAIT"
    "Vd2 gd T cells": "gdT"
    "Non-Vd2 gd T cells": "gdT"
    "Natural killer cells": "NK"
